<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><title>找不到這個頁面 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261115d">
<style>
/* The 404 page (not-found-page): needs no sign-in and calls no API, so it works for anyone who lands here. */
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; color: var(--text); background: var(--page); }
.lost { width: min(100%, 440px); padding: 36px 28px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); text-align: center; }
.lost-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-size: 18px; font-weight: 700; }
.lost-brand img { display: block; width: 32px; height: 32px; }
.lost-code { margin: 28px 0 4px; color: var(--muted); font-size: 13px; letter-spacing: .12em; }
.lost h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.3; }
.lost p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.lost .lost-hint { margin-top: 8px; font-size: 14px; }
.lost-links a[hidden] { display: none; }
.lost-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
.lost-links a { min-height: 44px; padding: 0 20px; display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; }
.lost-links a.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.lost-links a:hover { border-color: var(--accent); }
.lost-links a:focus-visible, .lost-brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style></head>
<body>
<main class="lost">
  <a class="lost-brand" href="/"><img src="/assets/favicon-192.png?v=2" alt="" width="32" height="32"><span>語橋 Live</span></a>
  <p class="lost-code">404</p>
  <h1>找不到這個頁面</h1>
  <p>連結可能已失效，或你沒有開啟它的權限。</p>
  <p class="lost-hint">如果這是團隊的會議，請團隊管理員確認你在該團隊中。</p>
  <nav class="lost-links" aria-label="接下來可以去">
    <a id="back" href="/" hidden>返回上一頁</a>
    <a class="primary" href="/">回開會頁</a>
    <a href="/meetings">會議紀錄</a>
  </nav>
</main>
<script>
// 返回上一頁 only when the person came here from a page of this site (not-found-page; Referrer-Policy is same-origin,
// so other sites never show up here); history.length cannot tell, a new tab already counts its blank page. Not after
// signing in: the sign-in page replaced itself, so going back would leave the site. No API call.
if(document.referrer.startsWith(location.origin+'/')&&new URL(document.referrer).pathname!=='/login'){const back=document.getElementById('back');back.hidden=false;back.onclick=event=>{event.preventDefault();history.back()}}
</script>
</body></html>
