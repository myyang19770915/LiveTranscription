<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>我的紀錄 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261123nd"><link rel="stylesheet" href="/assets/admin.css?v=20261123sd"><link rel="stylesheet" href="/assets/interpret.css?v=20261118rn"><link rel="stylesheet" href="/assets/topbar.css?v=20261123sm2"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>我的紀錄</small></span></a>
  <div class="topbar-actions">
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page interpret">
  <div class="page-head">
    <div>
      <h1>我的紀錄</h1>
      <p class="retention-note"><span id="retention"></span></p>
    </div>
    <div class="status-row" aria-live="polite">
      <span class="stat">長度 <b id="sent">0:00.0</b></span>
      <span class="stat">花費 <b id="cost">$0.000</b></span>
    </div>
  </div>

  <p id="error" class="alert" role="alert" hidden></p>

  <section class="card history" aria-labelledby="historyTitle">
    <h2 id="historyTitle">紀錄列表</h2>
    <div class="table-wrap"><table><thead><tr><th>時間</th><th>類型</th><th>語言</th><th>長度</th><th>花費</th><th>內容</th><th><span class="sr-only">動作</span></th></tr></thead><tbody id="historyRows"></tbody></table></div>
    <p id="historyEmpty" class="empty-note">還沒有紀錄。在首頁用即時翻譯或即時口譯後，就會出現在這裡。</p>
  </section>

  <section class="card wave-card" aria-labelledby="waveTitle">
    <div class="wave-head">
      <div>
        <h2 id="waveTitle">波形與重播</h2>
        <p class="hint">上方是原音，下方是譯音（即時口譯才有）。點或拖動波形，放開處開始播放，播放內容依標示中的按鈕。</p>
      </div>
      <div class="legend"><span class="in">原音</span><span class="out">譯音</span></div>
    </div>
    <div class="replay" role="group" aria-label="重播">
      <button id="replayBoth" class="mode-button" type="button" disabled>播放整段（原音＋譯音）</button>
      <button id="replayOut" class="mode-button" type="button" disabled>只聽譯音</button>
      <button id="replayIn" class="mode-button" type="button" disabled>只聽原音</button>
    </div>
    <div class="wave"><canvas id="wave" aria-label="原音與譯音的波形"></canvas></div>
    <p id="loaded" class="loaded" hidden></p>
    <p class="hint stats">譯音長度 <b id="outLen">0.0 秒</b></p>
  </section>

  <section class="texts">
    <div class="card text-card"><h2>原文 <small id="srcEngine"></small></h2><div id="srcText" class="text"></div></div>
    <div class="card text-card"><h2>譯文</h2><div id="outText" class="text"></div></div>
  </section>
</main>

<dialog id="convertDialog" class="convert-dialog" aria-labelledby="convertTitle">
  <form id="convertForm" method="dialog">
    <h2 id="convertTitle">轉成會議紀錄</h2>
    <p id="convertWhat" class="hint"></p>
    <label class="field" for="convertTeam">團隊</label>
    <select id="convertTeam" class="input"></select>
    <label class="field" for="convertName">標題</label>
    <input id="convertName" class="input" maxlength="100" autocomplete="off">
    <p id="convertNote" class="convert-note"></p>
    <p id="convertError" class="alert" role="alert" hidden></p>
    <div class="convert-actions">
      <button id="convertCancel" class="secondary-button compact" type="button">取消</button>
      <button id="convertGo" class="primary-button compact" type="submit">轉換</button>
    </div>
  </form>
</dialog>

<script src="/assets/return-path.js?v=20261113c"></script>
<script src="/assets/account.js?v=20261118ph"></script>
<script src="/assets/interpret-langs.js?v=20261118a"></script>
<script src="/assets/interpret.js?v=20261118rq"></script>
</body>
</html>
