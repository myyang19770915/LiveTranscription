<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>會議紀要 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261108b"><link rel="stylesheet" href="/assets/admin.css?v=20261108d"><link rel="stylesheet" href="/assets/review.css?v=20261107a"><link rel="stylesheet" href="/assets/evidence-panel.css?v=20261107a"><link rel="stylesheet" href="/assets/minutes.css?v=20261107b"><link rel="stylesheet" href="/assets/actions.css?v=20261108a"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>會議紀錄</small></span></a>
  <div class="topbar-actions">
    <a class="ghost-button" href="/meetings">會議紀錄</a>
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page review-page">
  <nav class="crumbs"><a id="back" class="back-link" href="/meetings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>返回會議紀錄</a></nav>
  <div class="page-head">
    <div>
      <h1 id="title">&nbsp;</h1>
      <p id="meta" class="meeting-meta"></p>
    </div>
    <div class="head-actions">
      <button id="generate" class="primary-button" type="button">產生紀要</button>
      <a id="download" class="secondary-button link-button" href="#" download>下載 Markdown</a>
    </div>
  </div>
  <nav class="view-tabs" aria-label="會議檢視"><a id="tabReview" class="view-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>逐字稿校對</a><a id="tabMinutes" class="view-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>會議紀要</a></nav>

  <section class="card toolbar">
    <p class="hint">AI 會從整場逐字稿整理摘要、決議、待辦、待確認問題與風險，每條附上證據段落；<b>確認後才算正式紀錄</b>，下載的 Markdown 只包含已確認的條目。<span id="modelNote"></span></p>
    <p id="status" class="status-line" role="status"></p>
  </section>

  <p id="notice" class="alert" role="alert" hidden></p>

  <section class="card summary-card">
    <div class="section-head"><h2>摘要</h2><button id="editSummary" class="text-button" type="button">編輯</button></div>
    <p id="summary" class="summary-text"></p>
    <form id="summaryForm" class="edit-form" hidden><textarea id="summaryInput" class="input editor" rows="5" maxlength="4000" aria-label="摘要"></textarea>
      <div class="edit-buttons"><button class="primary-button compact" type="submit">儲存</button><button id="cancelSummary" class="text-button" type="button">取消</button></div></form>
  </section>

  <section id="progress" class="card progress-card" aria-labelledby="progressHeading" hidden>
    <div class="section-head"><h2 id="progressHeading">會中進度提示 <span id="progressCount" class="count">0</span></h2></div>
    <p class="hint">會議中偵測到這個系列之前的待辦有進度，還沒處理。套用後會更新那個待辦的狀態並記入歷程。</p>
    <div id="progressList" class="progress-list"></div>
  </section>

  <div id="sections"></div>
</main>

<aside id="peek" class="peek" aria-labelledby="peekTitle" hidden>
  <div class="peek-head">
    <div><p id="peekKind" class="peek-kind"></p><h2 id="peekTitle" class="peek-title"></h2></div>
    <button id="peekClose" class="icon-button" type="button" aria-label="關閉證據" title="關閉（Esc）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <p class="peek-hint">引用的段落以綠色標示，前後各附一段上下文。按 ▶ 聽那段錄音。</p>
  <div id="peekList" class="peek-list"></div>
</aside>
<audio id="player" preload="none"></audio>

<script src="/assets/account.js?v=20261108c"></script>
<script src="/assets/meeting-catalog.js?v=20261105a"></script>
<script src="/assets/timeline.js?v=20261106a"></script>
<script src="/assets/meeting-nav.js?v=20261107a"></script>
<script src="/assets/action-status.js?v=20261107c"></script>
<script src="/assets/evidence-panel.js?v=20261107b"></script>
<script src="/assets/minutes.js?v=20261107d"></script>
</body></html>
