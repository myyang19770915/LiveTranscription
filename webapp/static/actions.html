<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>待辦看板 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261105a"><link rel="stylesheet" href="/assets/admin.css?v=20261107b"><link rel="stylesheet" href="/assets/review.css?v=20261107a"><link rel="stylesheet" href="/assets/actions.css?v=20261107d"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=1" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>待辦看板</small></span></a>
  <div class="topbar-actions">
    <a class="ghost-button" href="/meetings">會議紀錄</a>
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page board-page">
  <div class="board-head">
    <div>
      <p class="eyebrow">ACTIONS</p>
      <h1>待辦看板</h1>
    </div>
    <p id="summary" class="summary" aria-live="polite"></p>
  </div>

  <form id="filters" class="board-toolbar" role="search">
    <div class="toolbar-row">
      <label class="board-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><input id="q" type="search" maxlength="100" placeholder="搜尋待辦" aria-label="搜尋待辦內容" autocomplete="off"></label>
      <div id="avatars" class="avatar-filter" role="group" aria-label="依負責人篩選"></div>
      <span class="toolbar-gap"></span>
      <label class="toolbar-select">團隊<select id="team"><option value="">全部</option></select></label>
      <label class="toolbar-select">分組<select id="group"><option value="">不分組</option><option value="owner">依負責人</option><option value="meeting">依來源會議</option></select></label>
    </div>
    <div class="toolbar-row quick-filters" role="group" aria-label="快速篩選">
      <button type="button" class="quick" data-key="owner" data-value="me">只看我的</button>
      <button type="button" class="quick" data-key="owner" data-value="none">未指派</button>
      <span class="quick-divider" aria-hidden="true"></span>
      <button type="button" class="quick" data-key="due" data-value="overdue">逾期</button>
      <button type="button" class="quick" data-key="due" data-value="week">7 天內到期</button>
      <button type="button" class="quick" data-key="due" data-value="none">沒有到期日</button>
      <span class="quick-divider" aria-hidden="true"></span>
      <button type="button" class="quick" data-key="cancelled" data-value="1">顯示已取消</button>
      <button id="clear" class="text-button" type="button" hidden>清除篩選</button>
    </div>
  </form>

  <p id="notice" class="alert" role="alert" hidden></p>
  <section id="board" class="board" aria-label="待辦" aria-live="polite"></section>
</main>

<aside id="detail" class="detail" aria-labelledby="detailTitle" hidden>
  <div class="detail-head">
    <span id="detailKey" class="issue-key"></span>
    <button id="detailClose" class="icon-button" type="button" aria-label="關閉（Esc）" title="關閉（Esc）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="detailBody" class="detail-body"></div>
</aside>

<script src="/assets/account.js?v=20261107b"></script>
<script src="/assets/meeting-catalog.js?v=20261105a"></script>
<script src="/assets/board.js?v=20261107a"></script>
<script src="/assets/action-status.js?v=20261107b"></script>
<script src="/assets/actions.js?v=20261107f"></script>
</body></html>
