<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>待辦看板 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261105a"><link rel="stylesheet" href="/assets/admin.css?v=20261106c"><link rel="stylesheet" href="/assets/review.css?v=20261106c"><link rel="stylesheet" href="/assets/actions.css?v=20261106b"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=1" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>待辦看板</small></span></a>
  <div class="topbar-actions">
    <a class="ghost-button" href="/meetings">會議紀錄</a>
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page board-page">
  <div class="page-head">
    <div>
      <p class="eyebrow">ACTIONS</p>
      <h1>待辦看板</h1>
      <p class="lead">你所屬團隊在會議紀要中已確認的待辦。改狀態會留下歷程；到期日已過、還沒完成的待辦以紅字標示逾期天數。</p>
    </div>
    <p id="summary" class="summary" aria-live="polite"></p>
  </div>

  <form id="filters" class="card filters" role="search">
    <label class="filter-search">搜尋內容<input id="q" class="input compact" type="search" maxlength="100" placeholder="例如 合約" autocomplete="off"></label>
    <label>團隊<select id="team" class="input compact"><option value="">全部團隊</option></select></label>
    <label>負責人<select id="owner" class="input compact"><option value="">所有人</option><option value="me">我的</option><option value="none">未指派</option></select></label>
    <label>到期<select id="due" class="input compact"><option value="">全部</option><option value="overdue">逾期</option><option value="week">7 天內到期</option><option value="none">沒有到期日</option></select></label>
    <label class="toggle filter-toggle"><input id="cancelled" type="checkbox"> 顯示已取消</label>
    <button id="clear" class="text-button" type="button" hidden>清除篩選</button>
  </form>

  <p id="notice" class="alert" role="alert" hidden></p>
  <section id="board" class="board" aria-label="待辦" aria-live="polite"></section>
</main>

<script src="/assets/account.js?v=20261106b"></script>
<script src="/assets/meeting-catalog.js?v=20261105a"></script>
<script src="/assets/action-status.js?v=20261106a"></script>
<script src="/assets/actions.js?v=20261106b"></script>
</body></html>
