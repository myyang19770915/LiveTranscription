<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>搜尋 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261108b"><link rel="stylesheet" href="/assets/admin.css?v=20261108d"><link rel="stylesheet" href="/assets/search.css?v=20261108a"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>搜尋</small></span></a>
  <div class="topbar-actions">
    <a class="ghost-button" href="/meetings">會議紀錄</a>
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page search-page">
  <p class="eyebrow">SEARCH</p>
  <div class="search-title"><h1>搜尋</h1>
    <nav class="mode-switch" aria-label="查詢方式"><a href="/search" aria-current="page">全文搜尋</a><a id="toAsk" href="/ask">問答</a></nav></div>
  <form id="searchForm" class="search-form" role="search">
    <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="q" type="search" maxlength="100" placeholder="搜尋逐字稿、紀要與會議主題" aria-label="搜尋逐字稿、紀要與會議主題" autocomplete="off"></label>
    <button class="primary-button compact" type="submit">搜尋</button>
  </form>
  <div class="search-filters">
    <div class="kind-tabs" role="group" aria-label="類型">
      <button type="button" class="kind" data-kind="all">全部</button>
      <button type="button" class="kind" data-kind="segments">逐字稿</button>
      <button type="button" class="kind" data-kind="items">紀要</button>
      <button type="button" class="kind" data-kind="meetings">會議主題</button>
    </div>
    <label class="filter-select">團隊<select id="team"><option value="">全部</option></select></label>
    <label class="filter-select">系列<select id="series"><option value="">全部</option></select></label>
    <label class="filter-select">從<input id="from" type="date"></label>
    <label class="filter-select">到<input id="to" type="date"></label>
    <button id="clear" class="text-button" type="button" hidden>清除篩選</button>
  </div>

  <p id="summary" class="search-summary" aria-live="polite"></p>
  <p id="notice" class="alert" role="alert" hidden></p>
  <section id="results" class="results" aria-label="搜尋結果"></section>
</main>

<script src="/assets/account.js?v=20261109a"></script>
<script src="/assets/meeting-catalog.js?v=20261105a"></script>
<script src="/assets/search.js?v=20261107f"></script>
</body></html>
