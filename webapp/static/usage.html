<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>管理</small></span></a>
  <div class="topbar-actions">
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>

<main class="page metrics-page usage-page">
  <nav class="section-tabs" aria-label="管理"><a href="/admin">團隊管理</a><a href="/admin/usage" aria-current="page">用量管理</a><a href="/admin/settings">系統設定</a></nav>
  <div class="page-head">
    <div>
      <h1>用量管理</h1>
      <p class="lead">雲端辨識和即時口譯是按用量付費的外部服務。<strong>金額依用量和目前單價估算，不是帳單。</strong></p>
    </div>
    <p id="asOf" class="summary" aria-live="polite">讀取中…</p>
  </div>

  <p id="loadError" class="alert" role="alert" hidden></p>
  <div id="warnings"></div>

  <div id="content" hidden>
    <section id="tiles" class="tiles" aria-label="估算金額"></section>

    <section id="budgets" class="budget-grid" aria-label="各服務的累計金額與上限"></section>

    <section class="card viz-card" aria-labelledby="dailyTitle">
      <div class="viz-title-row">
        <h2 id="dailyTitle">每日估算金額</h2>
        <button id="dailyTable" class="text-button" type="button" aria-pressed="false">表格</button>
      </div>
      <p class="viz-sub">近 30 天，每天兩個服務的估算金額（美元）</p>
      <div id="daily" class="weekly"></div>
    </section>

    <section class="card viz-card" aria-labelledby="monthlyTitle">
      <h2 id="monthlyTitle">每月用量</h2>
      <p class="viz-sub">最近 6 個月的時數和估算金額</p>
      <div id="monthly"></div>
    </section>

    <div class="metrics-grid usage-grid">
      <section class="card viz-card" aria-labelledby="purposeTitle">
        <h2 id="purposeTitle">依用途</h2>
        <p class="viz-sub">每個服務用在哪裡</p>
        <div id="purposes"></div>
      </section>
      <section class="card viz-card" aria-labelledby="usersTitle">
        <h2 id="usersTitle">即時口譯依使用者</h2>
        <p class="viz-sub">雲端辨識不記錄使用者</p>
        <div id="users"></div>
      </section>
    </div>
  </div>
</main>
