<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>系統設定 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261123nd"><link rel="stylesheet" href="/assets/admin.css?v=20261125st"><link rel="stylesheet" href="/assets/topbar.css?v=20261124wp"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>管理</small></span></a>
  <div class="topbar-actions">
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page">
  <nav class="section-tabs" aria-label="管理"><a href="/admin">團隊管理</a><a href="/admin/usage">用量管理</a><a href="/admin/settings" aria-current="page">系統設定</a></nav>
  <div class="page-head">
    <div>
      <h1>系統設定</h1>
      <p class="lead">這裡的設定對所有團隊和使用者生效。</p>
    </div>
  </div>

  <p id="settingsError" class="alert" role="alert" hidden></p>

  <div class="card settings">
    <section id="retention" class="setting" aria-labelledby="retentionTitle">
      <div class="setting-text">
        <h2 id="retentionTitle">紀錄保存期限</h2>
        <p>即時翻譯與即時口譯紀錄超過天數會自動刪除。</p>
      </div>
      <div class="setting-control">
        <form id="retentionForm" class="row">
          <label class="retention-field">保存 <input id="retentionDays" class="input compact" type="number" min="1" max="3650" step="1" required aria-label="保存天數"> 天</label>
          <button class="secondary-button compact" type="submit">儲存</button>
        </form>
        <p id="retentionNote" class="setting-note" aria-live="polite"></p>
      </div>
    </section>

    <section id="interpretAccess" class="setting" aria-labelledby="accessTitle">
      <div class="setting-text">
        <h2 id="accessTitle">即時口譯權限</h2>
        <p>即時口譯在首頁「即時口譯」模式使用。系統管理員一律可用；其他人要在這裡加入帳號才能使用。</p>
      </div>
      <div class="setting-control">
        <ul id="accessList" class="members"></ul>
        <form id="accessForm" class="row add-member">
          <input id="accessName" class="input compact" placeholder="輸入公司帳號" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="開放即時口譯的帳號">
          <button class="secondary-button compact" type="submit">開放權限</button>
        </form>
      </div>
    </section>
  </div>
</main>

<script src="/assets/return-path.js?v=20261113c"></script>

<script src="/assets/settings.js?v=20261125st"></script>
</body></html>
