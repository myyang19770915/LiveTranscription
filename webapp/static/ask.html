<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>問答 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261108b"><link rel="stylesheet" href="/assets/admin.css?v=20261108d"><link rel="stylesheet" href="/assets/search.css?v=20261108a"><link rel="stylesheet" href="/assets/evidence-panel.css?v=20261107a"><link rel="stylesheet" href="/assets/ask.css?v=20261107b"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>問答</small></span></a>
  <div class="topbar-actions">
    <a class="ghost-button" href="/meetings">會議紀錄</a>
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page search-page ask-page">
  <p class="eyebrow">ASK</p>
  <div class="search-title"><h1>問答</h1>
    <nav class="mode-switch" aria-label="查詢方式"><a id="toSearch" href="/search">全文搜尋</a><a href="/ask" aria-current="page">問答</a></nav></div>
  <form id="askForm" class="search-form ask-form">
    <label class="search-box ask-box">
      <textarea id="q" rows="2" aria-label="問題" maxlength="300" placeholder="例如：上次跟客戶談價格的結論是什麼？" autocomplete="off"></textarea></label>
    <button id="askButton" class="primary-button compact" type="submit">問</button>
  </form>
  <div class="search-filters">
    <label class="filter-select">團隊<select id="team"><option value="">全部</option></select></label>
    <label class="filter-select">系列<select id="series"><option value="">全部</option></select></label>
    <label class="filter-select">從<input id="from" type="date"></label>
    <label class="filter-select">到<input id="to" type="date"></label>
    <button id="clear" class="text-button" type="button" hidden>清除篩選</button>
  </div>

  <p id="indexState" class="ask-index" hidden></p>
  <p id="summary" class="search-summary" aria-live="polite"></p>
  <p id="notice" class="alert" role="alert" hidden></p>
  <section id="answer" class="results" aria-label="回答"></section>
</main>

<aside id="peek" class="peek" aria-labelledby="peekTitle" hidden>
  <div class="peek-head">
    <div><p id="peekKind" class="peek-kind"></p><h2 id="peekTitle" class="peek-title"></h2></div>
    <button id="peekClose" class="icon-button" type="button" aria-label="關閉出處" title="關閉（Esc）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <p class="peek-hint">出處以綠色標示，前後各附一段上下文。按 ▶ 或空白鍵聽那段錄音。</p>
  <div id="peekList" class="peek-list"></div>
</aside>
<audio id="player" preload="none"></audio>

<script src="/assets/account.js?v=20261109a"></script>
<script src="/assets/meeting-catalog.js?v=20261105a"></script>
<script src="/assets/timeline.js?v=20261106a"></script>
<script src="/assets/evidence-panel.js?v=20261107b"></script>
<script src="/assets/ask.js?v=20261107d"></script>
</body></html>
