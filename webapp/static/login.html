<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>登入 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261126sl"><link rel="stylesheet" href="/assets/login.css?v=20261126sl"><link rel="stylesheet" href="/assets/topbar.css?v=20261124wp"></head>
<body>
<main class="auth">
  <!-- Left (sign-in-page): the brand, one sentence on what 語橋 Live does, and the meeting screen as it looks in use. -->
  <section class="auth-intro" aria-label="語橋 Live 介紹">
    <a class="auth-brand" href="/"><img src="/assets/brand-icon.png?v=2" alt="" width="40" height="40"><b>語橋 Live</b></a>
    <div class="auth-pitch">
      <h1 class="auth-title">會議中即時顯示逐字稿和翻譯</h1>
      <p class="auth-lead">支援中文、日文和英文。會後整理成會議紀要與待辦，之後可以跨會議搜尋。</p>

      <div class="auth-preview" role="img" aria-label="開會畫面示意：左邊是原文，右邊是翻譯">
        <div class="preview-pane" aria-hidden="true">
          <div class="preview-head"><span class="preview-badge">原</span><b>原文</b></div>
          <ol class="preview-lines">
            <li><time>10:02</time><span lang="ja">来週の出荷日程を確認させてください。</span></li>
            <li><time>10:02</time><span>好，第一批預計週三出貨。</span></li>
            <li><time>10:03</time><span lang="ja">数量は前回と同じでよろしいですか。</span></li>
          </ol>
        </div>
        <div class="preview-pane" aria-hidden="true">
          <div class="preview-head"><span class="preview-badge">中⇄日</span><b>翻譯</b></div>
          <ol class="preview-lines">
            <li><time>10:02</time><span>請讓我確認下週的出貨時程。</span></li>
            <li><time>10:02</time><span lang="ja">はい、第一便は水曜日に出荷予定です。</span></li>
            <li class="draft"><time>10:03</time><span>數量和上次一樣可以嗎</span><em>暫譯</em></li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <!-- Right: the sign-in form. -->
  <section class="auth-panel">
    <button id="themeToggle" class="auth-theme" type="button" aria-label="切換深淺主題" title="切換深淺主題">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg>
      <span class="auth-theme-label"></span>
    </button>
    <form id="loginForm" class="auth-form" novalidate>
      <h2>登入</h2>

      <label class="auth-label" for="username">帳號</label>
      <div class="auth-field">
        <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
        <input id="username" class="auth-input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="公司帳號" required autofocus>
      </div>

      <label class="auth-label" for="password">密碼</label>
      <div class="auth-field">
        <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10.5h12v10H6zM8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg>
        <input id="password" class="auth-input has-reveal" name="password" type="password" autocomplete="current-password" required>
        <button id="reveal" class="auth-reveal" type="button" aria-label="顯示密碼" aria-pressed="false" title="顯示密碼">
          <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.5 9.5 6a17 17 0 0 1-2.8 3.2M6.6 7.6A16 16 0 0 0 2.5 12c1 1.5 4.5 6 9.5 6a9 9 0 0 0 4.3-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12c1-1.5 4.5-6 9.5-6s8.5 4.5 9.5 6c-1 1.5-4.5 6-9.5 6s-8.5-4.5-9.5-6ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
        </button>
      </div>
      <p id="capsLock" class="auth-caps" hidden>大寫鎖定已開啟</p>

      <p id="loginError" class="auth-error" role="alert" hidden></p>
      <button id="loginButton" class="auth-submit" type="submit"><span class="spinner auth-spinner" aria-hidden="true"></span><span class="auth-submit-label">登入</span></button>
      <p class="auth-help">平台不保存你的密碼；忘記密碼請洽 IT。</p>
    </form>
    <p class="auth-copy">© 2026 語橋 Live</p>
  </section>
</main>
<script src="/assets/return-path.js?v=20261113c"></script>
<script>
const $=id=>document.getElementById(id),form=$('loginForm'),error=$('loginError'),button=$('loginButton');
function busy(on){button.disabled=on;button.classList.toggle('loading',on);button.querySelector('.auth-submit-label').textContent=on?'登入中…':'登入'}
function fail(message,field){const target=field||form.password;error.textContent=message;error.hidden=false;busy(false);target.setAttribute('aria-invalid','true');target.setAttribute('aria-describedby','loginError');target.focus();target.select?.()}
form.addEventListener('input',event=>event.target.removeAttribute('aria-invalid'));
form.onsubmit=async event=>{
  event.preventDefault();error.hidden=true;
  if(!form.username.value.trim())return fail('請輸入帳號',form.username);
  if(!form.password.value)return fail('請輸入密碼',form.password);
  busy(true);
  try{
    const response=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});
    if(response.ok){location.replace(ReturnPath.afterSignIn(location.search,location.hash));return}
    fail((await response.json().catch(()=>({}))).detail||'登入失敗');
  }catch{fail('無法連線到語橋 Live，請確認網路')}
};
$('reveal').onclick=()=>{const show=form.password.type==='password',label=show?'隱藏密碼':'顯示密碼';form.password.type=show?'text':'password';$('reveal').setAttribute('aria-pressed',show);$('reveal').setAttribute('aria-label',label);$('reveal').title=label;form.password.focus()};
form.password.addEventListener('keyup',event=>{$('capsLock').hidden=!event.getModifierState?.('CapsLock')});
form.password.addEventListener('blur',()=>{$('capsLock').hidden=true});
const themeLabel=()=>{document.querySelector('.auth-theme-label').textContent=document.documentElement.dataset.theme==='light'?'深色':'明亮'};
$('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;themeLabel();try{localStorage.setItem('interpreter-theme',next)}catch{}};
themeLabel();
</script>
</body></html>
