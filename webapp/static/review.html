<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>會後校對 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261108b"><link rel="stylesheet" href="/assets/admin.css?v=20261108d"><link rel="stylesheet" href="/assets/review.css?v=20261108b"><link rel="stylesheet" href="/assets/minutes.css?v=20261108d"><link rel="stylesheet" href="/assets/speakers.css?v=20261108b"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>會議紀錄</small></span></a>
  <div class="topbar-actions">
    <a class="ghost-button" href="/meetings">會議紀錄</a>
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page review-page">
  <nav class="crumbs"><a id="back" class="back-link" href="/meetings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>返回會議紀錄</a></nav>
  <div class="page-head">
    <div>
      <div id="titleRow" class="title-row"><h1 id="title">&nbsp;</h1><button id="renameButton" class="text-button" type="button">修改主題</button></div>
      <form id="renameForm" class="title-row rename-title" hidden><input id="titleInput" class="input" maxlength="100" placeholder="會議主題（清空則顯示開始時間）" aria-label="會議主題"><select id="seriesInput" class="input compact series-input" aria-label="系列"><option value="">不屬於系列</option></select><button class="primary-button compact" type="submit">儲存</button><button id="renameCancel" class="text-button" type="button">取消</button></form>
      <p id="meta" class="meeting-meta"></p>
    </div>
    <div class="review-progress">
      <span id="progressText" class="small"></span>
      <span class="bar" aria-hidden="true"><i id="progressBar"></i></span>
    </div>
  </div>
  <nav class="view-tabs" aria-label="會議檢視"><a id="tabReview" class="view-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>逐字稿校對</a><a id="tabMinutes" class="view-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>會議紀要</a></nav>

  <div class="card toolbar">
    <p class="hint">點一段就會播放那段錄音。修正轉錄後按「儲存並重譯」，譯文會用和會議中相同的方式（帶前後文與會議詞彙）重新翻譯；每次修改都會留下紀錄。</p>
    <label id="refineRow" class="toggle" hidden><input id="refine" type="checkbox"> 雲端精修 <span class="muted small">會議內容會傳送到外部服務</span></label>
  </div>

  <section id="speakers" class="card speakers" aria-label="說話者" hidden></section>
  <p id="notice" class="alert" role="alert" hidden></p>
  <div class="segment-head" aria-hidden="true"><span>時間</span><span>原文（轉錄）</span><span>譯文</span><span></span></div>
  <section id="segments" class="segments" aria-label="段落"></section>
  <audio id="player" preload="none"></audio>
</main>

<script src="/assets/account.js?v=20261109b"></script>
<script src="/assets/translation-context.js?v=20261104b"></script>

<script src="/assets/meeting-nav.js?v=20261107a"></script>
<script src="/assets/speakers.js?v=20261108d"></script>
<script src="/assets/review.js?v=20261112c"></script>
</body></html>
