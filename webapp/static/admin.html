<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><title>團隊管理 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261118a"><link rel="stylesheet" href="/assets/admin.css?v=20261118rm"><link rel="stylesheet" href="/assets/topbar.css?v=20261118d"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=2" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>團隊管理</small></span></a>
  <div class="topbar-actions">
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <p class="eyebrow">TEAMS</p>
      <h1>團隊管理</h1>
      <p class="lead">每場會議屬於一個團隊，<strong>不同團隊的會議紀錄互相看不到</strong>。成員可以先用公司帳號加入，對方第一次登入時就會生效。</p>
    </div>
    <p id="summary" class="summary" aria-live="polite"></p>
  </div>

  <section id="maiUsage" class="create card" aria-labelledby="maiUsageTitle" hidden>
    <h2 id="maiUsageTitle" class="label">雲端辨識用量</h2>
    <p id="maiUsageText" class="summary"></p>
    <p id="maiUsageWarn" class="alert" role="alert" hidden></p>
  </section>

  <section id="interpretCard" class="create card interpret-entry" aria-labelledby="interpretTitle">
    <h2 id="interpretTitle" class="label">即時口譯用量</h2>
    <p id="interpretUsageText" class="summary">讀取中…</p>
    <ul id="interpretByUser" class="usage-users" hidden></ul>
  </section>

  <section id="interpretAccess" class="create card interpret-entry" aria-labelledby="accessTitle">
    <h2 id="accessTitle" class="label">即時口譯權限</h2>
    <p class="summary">即時口譯在首頁「即時口譯」模式使用。系統管理員一律可用；其他人要在這裡加入帳號才能使用。</p>
    <ul id="accessList" class="members"></ul>
    <form id="accessForm" class="row add-member">
      <input id="accessName" class="input" placeholder="輸入公司帳號" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="開放即時口譯的帳號">
      <button class="secondary-button" type="submit">開放權限</button>
    </form>
  </section>

  <section id="retention" class="create card interpret-entry" aria-labelledby="retentionTitle">
    <h2 id="retentionTitle" class="label">紀錄保存期限</h2>
    <p class="summary">即時翻譯與即時口譯紀錄超過天數會自動刪除。</p>
    <form id="retentionForm" class="row">
      <label class="retention-field">保存 <input id="retentionDays" class="input compact" type="number" min="1" max="3650" step="1" required aria-label="保存天數"> 天</label>
      <button class="secondary-button" type="submit">儲存</button>
    </form>
    <p id="retentionNote" class="summary" aria-live="polite"></p>
  </section>

  <form id="createTeam" class="create card">
    <label class="label" for="teamName">建立新團隊</label>
    <div class="row">
      <input id="teamName" class="input" maxlength="100" autocomplete="off" placeholder="例如 研發部、業務部" required>
      <button class="primary-button" type="submit">建立團隊</button>
    </div>
  </form>

  <p id="adminError" class="alert" role="alert" hidden></p>
  <section id="teams" class="team-grid" aria-label="團隊列表"></section>
</main>

<script src="/assets/return-path.js?v=20261113c"></script>
<script src="/assets/account.js?v=20261118ph"></script>
<script>
const $=id=>document.getElementById(id);
function el(tag,props={},...children){const node=Object.assign(document.createElement(tag),props);node.append(...children.filter(child=>child!=null));return node}
function showError(message){$('adminError').textContent=message;$('adminError').hidden=!message}
// Azure MAI is billed by the audio sent (mai-usage): what has accumulated, against the budget. Reaching it stops nothing.
function showMaiUsage(usage){
  if(!usage)return;
  $('maiUsage').hidden=false;
  $('maiUsageText').textContent=`累計送出 ${(usage.seconds/3600).toFixed(1)} 小時的音訊，約 ${usage.usd.toFixed(2)} 美元（上限 ${usage.budgetUsd} 美元，每小時 ${usage.usdPerHour} 美元）。金額依送出的音訊長度估算，不是帳單。`;
  const warn={near:'已達上限的八成。',over:'已達到或超過上限。雲端辨識仍可使用，是否繼續由你決定。'}[usage.state]||'';
  $('maiUsageWarn').textContent=warn;$('maiUsageWarn').hidden=!warn;
}
fetch('/api/admin/mai-usage').then(response=>response.ok?response.json():null).then(showMaiUsage).catch(()=>{});
// 即時口譯 (realtime-interpret): the translated speech is billed by its length; it is not part of the MAI budget.
function showInterpretUsage(usage){
  $('interpretUsageText').textContent=usage?`累計收到 ${(usage.seconds/3600).toFixed(2)} 小時的譯音，約 ${usage.usd.toFixed(2)} 美元（每小時 ${usage.usdPerHour} 美元，不算進雲端辨識的上限）。金額依譯音長度估算，不是帳單。`:'用量暫時讀不到。';
  // Per user (interpret-mode-on-home); '' is usage entered by hand before users were recorded.
  const users=Object.entries(usage?.byUser||{}).sort((a,b)=>b[1]-a[1]);
  $('interpretByUser').hidden=!users.length;
  $('interpretByUser').replaceChildren(...users.map(([name,seconds])=>el('li',{},el('b',{textContent:name||'（未記名）'}),
    el('span',{textContent:`${(seconds/3600).toFixed(2)} 小時，約 ${(seconds/3600*usage.usdPerHour).toFixed(2)} 美元`}))));
}
fetch('/api/admin/interpret-usage').then(response=>response.ok?response.json():null).then(showInterpretUsage).catch(()=>showInterpretUsage(null));
async function call(method,url,body){
  const response=await fetch(url,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(!response.ok){const detail=(await response.json().catch(()=>({}))).detail;throw new Error(typeof detail==='string'?detail:'操作失敗，請再試一次')}
  return response.status===204?null:response.json();
}
async function act(work,button){showError('');if(button)button.disabled=true;try{await work();await load()}catch(error){showError(error.message)}finally{if(button)button.disabled=false}}
function initial(member){return [...(member.displayName||member.username)][0].toUpperCase()}
// A button that asks once more ("確定…？") before doing its work; the question goes away after 4 s.
// danger=false for 移除照片: it only clears a photo, so it must not look like 移出團隊 next to it (ui-review-fixes).
function confirmButton(label,question,work,danger=true){
  const button=el('button',{type:'button',className:danger?'text-button danger':'text-button',textContent:label});
  button.onclick=()=>{
    if(button.dataset.confirm){act(work,button);return}
    button.dataset.confirm='1';button.textContent=question;
    setTimeout(()=>{if(button.isConnected){delete button.dataset.confirm;button.textContent=label}},4000);
  };
  return button;
}

// Profile photos (member-avatars, avatar-self-service): the avatar itself opens the picker; AvatarPhoto (account.js)
// crops to the centre square and uploads.
const CAMERA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
// An administrator changing their own row: the header avatar follows.
async function ownChanged(member,avatarUrl){
  if(member.username===(await accountReady).username)window.dispatchEvent(new CustomEvent('yq:avatar-own',{detail:{avatarUrl}}));
}
function avatar(member,name){
  const face=()=>{
    const letter=()=>el('span',{className:'avatar-face',textContent:initial(member)});
    if(!member.avatarUrl)return letter();
    const img=el('img',{className:'avatar-face',src:member.avatarUrl,alt:'',width:34,height:34});
    img.onerror=()=>img.replaceWith(letter());
    return img;
  };
  const picker=el('input',{type:'file',accept:'image/png,image/jpeg,image/webp',hidden:true});
  const button=el('button',{type:'button',className:`avatar avatar-edit${member.avatarUrl?' photo':''}`,title:member.avatarUrl?'更換照片':'設定照片',
    ariaLabel:`${member.avatarUrl?'更換':'設定'}${name}的照片`,onclick:()=>picker.click()},face(),el('span',{className:'avatar-camera',innerHTML:CAMERA}));
  picker.onchange=()=>{const file=picker.files[0];picker.value='';if(file)act(async()=>{
    const result=await AvatarPhoto.upload(`/api/admin/users/${encodeURIComponent(member.username)}/avatar`,file);
    if(result)ownChanged(member,result.avatarUrl);   // null: the crop was cancelled, nothing changed
  },button)};
  return [button,picker];
}

function memberRow(team,member){
  const named=member.displayName&&member.displayName!==member.username;
  const name=named?member.displayName:member.username;
  const remove=confirmButton('移出團隊',`確定把${name}移出${team.name}？`,()=>call('DELETE',`/api/admin/teams/${team.id}/members/${encodeURIComponent(member.username)}`));
  const clear=member.avatarUrl?confirmButton('移除照片','確定移除照片？',async()=>{await call('DELETE',`/api/admin/users/${encodeURIComponent(member.username)}/avatar`);ownChanged(member,null)},false):null;
  return el('li',{className:'member'},
    ...avatar(member,name),
    el('span',{className:'member-text'},el('b',{textContent:name}),named?el('small',{textContent:member.username}):null),
    member.signedIn?null:el('span',{className:'chip',textContent:'尚未登入過',title:'帳號已加入，對方第一次登入時生效'}),
    el('span',{className:'member-actions'},clear,remove));
}

function teamCard(team){
  const title=el('h2',{textContent:team.name});
  const count=el('span',{className:'count',textContent:`${team.members.length} 位成員`});
  const renameButton=el('button',{type:'button',className:'text-button',textContent:'改名'});
  const head=el('div',{className:'team-head'},el('div',{className:'team-title'},title,count),renameButton);
  renameButton.onclick=()=>{
    const input=el('input',{className:'input compact',value:team.name,maxLength:100,ariaLabel:`「${team.name}」的新名稱`});
    const save=el('button',{type:'submit',className:'primary-button compact',textContent:'儲存'});
    const cancel=el('button',{type:'button',className:'text-button',textContent:'取消',onclick:()=>form.replaceWith(head)});
    const form=el('form',{className:'rename',onsubmit:event=>{event.preventDefault();act(()=>call('PATCH',`/api/admin/teams/${team.id}`,{name:input.value}),save)}},input,save,cancel);
    head.replaceWith(form);input.focus();input.select();
  };
  const list=team.members.length?el('ul',{className:'members'},...team.members.map(member=>memberRow(team,member)))
    :el('p',{className:'empty-members',textContent:'還沒有成員。加入成員後，他們才能用這個團隊開會。'});
  const username=el('input',{className:'input',placeholder:'輸入公司帳號',autocomplete:'off',autocapitalize:'none',spellcheck:false,ariaLabel:`加入「${team.name}」的帳號`});
  const add=el('button',{type:'submit',className:'secondary-button',textContent:'加入成員'});
  const addForm=el('form',{className:'row add-member',onsubmit:event=>{event.preventDefault();if(username.value.trim())act(()=>call('POST',`/api/admin/teams/${team.id}/members`,{username:username.value}),add)}},username,add);
  return el('article',{className:'card team'},head,list,addForm);
}

async function load(){
  const teams=await call('GET','/api/admin/teams');
  const people=new Set(teams.flatMap(team=>team.members.map(member=>member.username)));
  $('summary').textContent=teams.length?`${teams.length} 個團隊 · ${people.size} 位成員`:'';
  $('teams').replaceChildren(...(teams.length?teams.map(teamCard):[el('div',{className:'card empty'},
    el('b',{textContent:'還沒有任何團隊'}),el('p',{textContent:'在上方輸入名稱建立第一個團隊，再把成員加進去。'}))]));
}
// 即時口譯權限 (interpret-mode-on-home): administrators grant the accounts that may interpret.
async function loadAccess(){
  const granted=await call('GET','/api/admin/interpret-access');
  $('accessList').replaceChildren(...(granted.length?granted.map(g=>el('li',{className:'member'},
    el('span',{className:'member-text'},el('b',{textContent:g.username}),el('small',{textContent:`由 ${g.grantedBy} 開放`})),
    el('span',{className:'member-actions'},confirmButton('移除',`確定移除 ${g.username} 的即時口譯權限？`,async()=>{await call('DELETE',`/api/admin/interpret-access/${encodeURIComponent(g.username)}`);await loadAccess()}))))
    :[el('li',{className:'empty-members',textContent:'還沒有開放給任何人。'})]));
}
$('accessForm').onsubmit=event=>{event.preventDefault();const name=$('accessName').value.trim();if(!name)return;
  act(async()=>{await call('POST','/api/admin/interpret-access',{username:name});$('accessName').value='';await loadAccess()},event.submitter)};
loadAccess().catch(error=>showError(error.message));
// 紀錄保存期限: how many days saved 即時翻譯 / 即時口譯 records are kept.
call('GET','/api/admin/records-retention').then(r=>{$('retentionDays').value=r.days}).catch(error=>showError(error.message));
$('retentionForm').onsubmit=event=>{event.preventDefault();const days=Number($('retentionDays').value);
  act(async()=>{const r=await call('PUT','/api/admin/records-retention',{days});$('retentionDays').value=r.days;$('retentionNote').textContent=`已儲存：保存 ${r.days} 天，較舊的紀錄已刪除。`},event.submitter)};
$('createTeam').onsubmit=event=>{event.preventDefault();const button=event.submitter;act(async()=>{await call('POST','/api/admin/teams',{name:$('teamName').value});$('teamName').value=''},button)};
$('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;try{localStorage.setItem('interpreter-theme',next)}catch{}};
load().catch(error=>showError(error.message));
// The header menu changed the signed-in administrator's own photo.
window.onPageShown(()=>{load().catch(error=>showError(error.message));loadAccess().catch(error=>showError(error.message))});   // shown after being prepared
window.addEventListener('yq:avatar',()=>load().catch(error=>showError(error.message)));
</script>
</body></html>
