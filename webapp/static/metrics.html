<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=1"><link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=1"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1"><title>成效指標 — 語橋 Live</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('interpreter-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/assets/tokens.css?v=20261105a"><link rel="stylesheet" href="/assets/admin.css?v=20261108c"><link rel="stylesheet" href="/assets/metrics.css?v=20261107c"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark"><img src="/assets/brand-icon.png?v=1" alt="" width="28" height="28"></span><span><b>語橋 Live</b><small>成效指標</small></span></a>
  <div class="topbar-actions">
    <a class="ghost-button" href="/meetings">會議紀錄</a>
    <div id="account" class="account"></div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="切換深淺主題" title="切換深淺主題"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><path class="moon" d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg></button>
  </div>
</header>

<main class="page metrics-page">
  <div class="metrics-head">
    <div>
      <p class="eyebrow">METRICS</p>
      <h1>成效指標</h1>
      <p id="range" class="summary" aria-live="polite"></p>
    </div>
    <form id="filters" class="metrics-filters">
      <label class="toolbar-select">團隊<select id="team"><option value="">全部</option></select></label>
      <label class="toolbar-select">期間<select id="days"><option value="30">近 30 天</option><option value="90">近 90 天</option><option value="365">近一年</option></select></label>
    </form>
  </div>

  <p id="notice" class="alert" role="alert" hidden></p>

  <section id="tiles" class="tiles" aria-label="主要指標"></section>

  <div class="metrics-grid">
    <section class="card viz-card" aria-labelledby="aiTitle">
      <h2 id="aiTitle">AI 抽取的條目怎麼被使用</h2>
      <p class="viz-sub">期間內開始的會議，AI 提出的決議、待辦、問題、風險</p>
      <div id="ai"></div>
    </section>
    <section class="card viz-card" aria-labelledby="weeklyTitle">
      <div class="viz-title-row">
        <h2 id="weeklyTitle">每週待辦</h2>
        <button id="weeklyTable" class="text-button" type="button" aria-pressed="false">表格</button>
      </div>
      <p class="viz-sub">最近 12 週，每週新增與完成的待辦件數</p>
      <div id="weekly" class="weekly"></div>
    </section>
  </div>

  <section class="card viz-card" aria-labelledby="transcriptTitle">
    <h2 id="transcriptTitle">轉錄修改率</h2>
    <p class="viz-sub">期間內開始的會議，校對後文字和辨識原文的差異（每百字修改字數以編輯距離計）</p>
    <div id="transcript"></div>
  </section>
</main>

<script src="/assets/account.js?v=20261108a"></script>
<script src="/assets/metrics.js?v=20261107c"></script>
</body></html>
