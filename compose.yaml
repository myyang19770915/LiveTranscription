services:
  asr:
    image: qwenllm/qwen3-asr:latest@sha256:fb75b775f089e06e5a1aaebffd421e37505cc630d50c86d889d95ffa45a7e16a   # pinned (app-image-reproducible); see README 固定版本
    gpus: all
    working_dir: /workspace
    command: ["bash", "/workspace/docker/asr/entrypoint.sh"]
    environment:
      ASR_MODEL_PATH: ${ASR_MODEL_PATH:-netease-youdao/Confucius4-R2T2}
      VAD_MODEL_PATH: /models/vad/Stream-VAD
      ASR_SECRET_KEY: ${ASR_SECRET_KEY:-change-me-local-only}
      HF_HOME: /models/huggingface
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.88}
      ASR_MAX_MODEL_LEN: ${ASR_MAX_MODEL_LEN:-16384}
      # Request logs (logs/requests/) never hold recognized text unless ASR_LOG_TEXT=1 (debugging; never for 即時翻譯)
      ASR_LOG_TEXT: ${ASR_LOG_TEXT:-0}
      ASR_LOG_RETENTION_DAYS: ${ASR_LOG_RETENTION_DAYS:-14}
      ASR_RECV_QUEUE_MAX: ${ASR_RECV_QUEUE_MAX:-500}   # unprocessed messages held per connection (stream-limits)
    volumes:
      - ./:/workspace
      - model-cache:/models
    shm_size: 4gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8272/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 10m

  # 精準模式's recognizer on this machine (quality-pass): Qwen3-ASR 1.7B behind vLLM's OpenAI-compatible API
  # (TRANSLATE_QUALITY_ASR_URL=http://qwen-asr:8000/v1). About 10 GB of GPU memory at 0.3: on a 32 GB card it does not
  # fit next to the local translation model, so use one profile or the other. The first start downloads the weights.
  qwen-asr:
    profiles: ["qwen-asr"]
    image: qwenllm/qwen3-asr:latest@sha256:fb75b775f089e06e5a1aaebffd421e37505cc630d50c86d889d95ffa45a7e16a   # the asr service's image
    gpus: all
    command: ["qwen-asr-serve", "Qwen/Qwen3-ASR-1.7B", "--gpu-memory-utilization", "${QWEN_GPU_MEMORY_UTILIZATION:-0.3}",
              "--max-model-len", "8192", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HF_HOME: /models/huggingface
    volumes:
      - model-cache:/models
      - ./docker/qwen-asr/healthcheck.py:/healthcheck.py:ro
    shm_size: 4gb
    restart: unless-stopped
    healthcheck:
      # A real three-second transcription: the first one in a new container takes ~30 s (warm-up), and 精準模式 must not meet it.
      test: ["CMD", "python3", "/healthcheck.py", "Qwen/Qwen3-ASR-1.7B", "50"]
      interval: 30s
      timeout: 60s
      retries: 20
      start_period: 15m

  # The local translation model. Optional since cloud-translation: start it with --profile local-translate, or set
  # TRANSLATE_URL/TRANSLATE_MODEL/TRANSLATE_KEY to an external service and leave it stopped.
  translate:
    profiles: ["local-translate"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:bfb3264fc2166e01e2b4f9b537e45d7006d87c75021b911f132ef607f5bbced3   # pinned (app-image-reproducible); see README 固定版本
    gpus: all
    command:
      - --hf-repo
      - ${TRANSLATE_MODEL_REPO:-google/gemma-4-E2B-it-qat-q4_0-gguf}
      - --hf-file
      - ${TRANSLATE_MODEL_FILE:-gemma-4-E2B_q4_0-it.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "3072"
      - --parallel
      - "1"
      - --flash-attn
      - on
      - --no-mmproj
      - --reasoning
      - "off"
      - --no-webui
    volumes:
      - translation-model-cache:/root/.cache
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 15m

  # Embeddings for 問答 (meeting-qa): llama.cpp on CPU, OpenAI-compatible /v1/embeddings. The app works without it
  # (問答 falls back to keyword retrieval). bge-m3 was chosen with bench/qa_eval.py (see the meeting-qa design); the first
  # start downloads it.
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:6d581c788abba2dfa23ff78dba37ea0abfc7d838c49bcc98f4be2103df9772b3   # pinned (app-image-reproducible); see README 固定版本
    command:
      - --hf-repo
      - ${EMBED_MODEL_REPO:-ggml-org/bge-m3-Q8_0-GGUF}
      - --hf-file
      - ${EMBED_MODEL_FILE:-bge-m3-q8_0.gguf}
      - --embeddings
      # The pooling the model was trained with: bge-m3 cls, Qwen3-Embedding last, embeddinggemma mean.
      - --pooling
      - ${EMBED_POOLING:-cls}
      - --host
      - 0.0.0.0
      - --port
      - "5001"
      - --ctx-size
      - "8192"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --parallel
      - "4"
      - --threads
      - ${EMBED_THREADS:-8}
      - --no-webui
    volumes:
      - embed-model-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 10m

  # Speaker diarization (speaker-diarization): MOSS-Transcribe-Diarize Q8_0 on CPU via transcribe.cpp, after a meeting
  # ends. No GPU (bench/README.md 2026-11-08 說話者辨識評估). The first start downloads the model (~1 GB). The app
  # works without it (no speakers). Recordings are read-only.
  diarize:
    build: ./docker/diarize
    environment:
      DIARIZE_THREADS: ${DIARIZE_THREADS:-16}
      DIARIZE_MODEL_URL: ${DIARIZE_MODEL_URL:-https://huggingface.co/handy-computer/MOSS-Transcribe-Diarize-gguf/resolve/main/MOSS-Transcribe-Diarize-Q8_0.gguf}
    volumes:
      - ./output:/output:ro
      - diarize-model-cache:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 10m

  app:
    build: ./webapp
    volumes:
      - ./webapp:/app
      - ./output:/output
    environment:
      ASR_WS_URL: ws://asr:8272/asr_stream_api_v1
      ASR_SECRET_KEY: ${ASR_SECRET_KEY:-change-me-local-only}
      # The translation model: the local llama.cpp service (profile local-translate), or with TRANSLATE_KEY an
      # OpenAI-compatible service outside this machine (cloud-translation). See README 翻譯模型放哪裡.
      TRANSLATE_URL: ${TRANSLATE_URL:-http://translate:5000}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-${TRANSLATE_MODEL_FILE:-gemma-4-E2B_q4_0-it.gguf}}
      TRANSLATE_KEY: ${TRANSLATE_KEY:-}
      TRANSLATE_EXTRA: ${TRANSLATE_EXTRA:-}
      TRANSLATE_HEALTH_URL: ${TRANSLATE_HEALTH_URL:-}
      # Optional cloud model for 雲端精修 (OpenAI-compatible base URL, e.g. https://api.openai.com/v1).
      TRANSLATE_REFINE_URL: ${TRANSLATE_REFINE_URL:-}
      TRANSLATE_REFINE_MODEL: ${TRANSLATE_REFINE_MODEL:-}
      TRANSLATE_REFINE_KEY: ${TRANSLATE_REFINE_KEY:-}
      # 精準模式 (quality-pass): off unless both models are set; URL and key default to TRANSLATE_REFINE_*.
      TRANSLATE_QUALITY_URL: ${TRANSLATE_QUALITY_URL:-}
      TRANSLATE_QUALITY_KEY: ${TRANSLATE_QUALITY_KEY:-}
      TRANSLATE_QUALITY_ASR_MODEL: ${TRANSLATE_QUALITY_ASR_MODEL:-}
      TRANSLATE_QUALITY_ASR: ${TRANSLATE_QUALITY_ASR:-}
      TRANSLATE_QUALITY_ASR_URL: ${TRANSLATE_QUALITY_ASR_URL:-}
      TRANSLATE_QUALITY_ASR_KEY: ${TRANSLATE_QUALITY_ASR_KEY:-}
      TRANSLATE_QUALITY_ASR_EXTRA: ${TRANSLATE_QUALITY_ASR_EXTRA:-}
      TRANSLATE_QUALITY_MODEL: ${TRANSLATE_QUALITY_MODEL:-}
      TRANSLATE_QUALITY_EXTRA: ${TRANSLATE_QUALITY_EXTRA:-}
      TRANSLATE_QUALITY_ALT: ${TRANSLATE_QUALITY_ALT:-}
      # Revision (quality-revision): shown sentences are checked again with more context; EXTRA usually turns reasoning on.
      TRANSLATE_QUALITY_REVISE: ${TRANSLATE_QUALITY_REVISE:-}
      TRANSLATE_QUALITY_REVISE_EXTRA: ${TRANSLATE_QUALITY_REVISE_EXTRA:-}
      TRANSLATE_PUNCTUATE_MAI: ${TRANSLATE_PUNCTUATE_MAI:-}
      AZURE_MAI_ENDPOINT: ${AZURE_MAI_ENDPOINT:-}
      AZURE_MAI_API_KEY: ${AZURE_MAI_API_KEY:-}
      AZURE_MAI_DEPLOYMENT: ${AZURE_MAI_DEPLOYMENT:-MAI-Transcribe-2-Streaming}
      DATABASE_URL: postgresql://yuqiao:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/yuqiao
      # Sign-in: company LDAP; ADMIN_USERS (comma-separated usernames) manage teams.
      ADMIN_USERS: ${ADMIN_USERS:-}
      # Azure MAI is billed by audio length (mai-usage): the price per hour and the budget administrators are warned at.
      MAI_USD_PER_HOUR: ${MAI_USD_PER_HOUR:-0.54}
      MAI_BUDGET_USD: ${MAI_BUDGET_USD:-50}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(sAMAccountName={username})}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-}
      LDAP_DISPLAY_ATTR: ${LDAP_DISPLAY_ATTR:-displayName}
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
      LDAP_TLS: ${LDAP_TLS:-starttls}
      LDAP_MAIL_ATTR: ${LDAP_MAIL_ATTR:-mail}
      # Sending the minutes by e-mail (company SMTP; empty SMTP_HOST = off). PUBLIC_BASE_URL is the link in the mail.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Daily due-date reminders to action item owners (HH:MM in MEETING_TIMEZONE); needs SMTP_HOST.
      REMIND_AT: ${REMIND_AT:-09:00}
      # Behind an HTTPS reverse proxy: trust its X-Forwarded-Proto (uvicorn reads this) and/or force Secure cookies.
      # Proxy headers (client IP, https) are believed only from the yuqiao-edge network the tunnel uses; LAN users
      # reaching port 18082 directly arrive through the Compose gateway and their headers are ignored (edge-proxy-trust).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.250.250.0/28}
      # stream-limits: recognition WebSocket and sign-in limits
      STREAM_HEADER_TIMEOUT: ${STREAM_HEADER_TIMEOUT:-30}
      MAX_STREAMS_PER_USER: ${MAX_STREAMS_PER_USER:-2}
      MAX_STREAM_HOURS: ${MAX_STREAM_HOURS:-4}
      STREAM_RECHECK_MINUTES: ${STREAM_RECHECK_MINUTES:-5}
      LOGIN_IP_MAX_FAILURES: ${LOGIN_IP_MAX_FAILURES:-30}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      # Local dates for the ASR training export's date range.
      MEETING_TIMEZONE: ${MEETING_TIMEZONE:-Asia/Taipei}
      # Minutes model (OpenAI-compatible, large context); unset = the 雲端精修 model above.
      MINUTES_URL: ${MINUTES_URL:-}
      MINUTES_MODEL: ${MINUTES_MODEL:-}
      MINUTES_KEY: ${MINUTES_KEY:-}
      # 問答 (meeting-qa): the embed service above; the file name picks the model's query/document prefixes.
      EMBED_URL: ${EMBED_URL:-http://embed:5001}
      EMBED_MODEL_FILE: ${EMBED_MODEL_FILE:-bge-m3-q8_0.gguf}
      # Speaker diarization service above; empty = off.
      DIARIZE_URL: ${DIARIZE_URL-http://diarize:5002}
    ports:
      - "${APP_PORT:-18082}:8080"
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      asr:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # Meetings, accounts and teams. Reachable only inside the Compose network.
  db:
    # PostgreSQL 17 with pgvector (meeting-qa), on the same Debian release as the former postgres:17 image so the
    # data directory and its collations carry over unchanged.
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: yuqiao
      POSTGRES_DB: yuqiao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - meeting-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuqiao -d yuqiao"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Dev-only directory with test accounts (docker/dev-ldap/users.ldif) for when the company LDAP is
  # unreachable. Starts only with: docker compose --profile dev-ldap up -d dev-ldap
  dev-ldap:
    image: osixia/openldap:1.5.0
    profiles: ["dev-ldap"]
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Yuqiao Test
      LDAP_DOMAIN: yuqiao.test
      LDAP_ADMIN_PASSWORD: ${DEV_LDAP_ADMIN_PASSWORD:-dev-only-not-reachable-outside-compose}
    volumes:
      - ./docker/dev-ldap/users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
    restart: unless-stopped

  # Dev-only mailbox (Mailpit): with SMTP_HOST=dev-mail, SMTP_PORT=1025, SMTP_TLS=none every mail stays here and nothing
  # leaves this machine. Read them at http://localhost:18025. Starts only with: docker compose --profile dev-mail up -d dev-mail
  dev-mail:
    image: axllent/mailpit:v1.27.0
    profiles: ["dev-mail"]
    ports:
      - "127.0.0.1:${DEV_MAIL_PORT:-18025}:8025"
    restart: unless-stopped

  # Public access through a Cloudflare Tunnel (profile "tunnel"; see README「對外開放」). The tunnel is created in the
  # Cloudflare dashboard, which also holds its routes: point the public hostname at http://app:8080. Outbound only:
  # no port is opened on this machine. The token stays in .env (CLOUDFLARE_TUNNEL_TOKEN), never in this file.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # empty: cloudflared stops with an error; set it in .env
    networks:
      - edge        # reaches the app as http://app:8080 from the trusted proxy network
    depends_on:
      - app
    restart: unless-stopped

networks:
  # The tunnel's way in. Fixed name and subnet: FORWARDED_ALLOW_IPS trusts exactly this range, and a cloudflared of
  # another project can join it with: docker network connect yuqiao-edge <container>
  edge:
    name: yuqiao-edge
    ipam:
      config:
        - subnet: 10.250.250.0/28

volumes:
  model-cache:
  translation-model-cache:
  embed-model-cache:
  diarize-model-cache:
  meeting-db:
